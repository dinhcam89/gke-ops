image:
  name: hashicorp/terraform:latest
  entrypoint:
    - '/usr/bin/env'
    - 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

before_script:
  - rm -rf .terraform
  - terraform --version
  - terraform init

stages:
  - validate
  - plan
  - apply
  - destroy

validate:
  stage: validate
  tags:
    - iac-runner-dev_shell
  script:
    - terraform init
    - terraform validate
    - terraform plan -out=tfplan -input=false

plan:
  stage: plan
  tags:
    - iac-runner-dev_shell
  script:
    - terraform init
    - terraform plan -out=tfplan -input=false
  artifacts:
    paths:
      - tfplan

apply:
  stage: apply
  when: manual
  tags:
    - iac-runner-dev_shell
  script:
    - terraform init
    - terraform apply -auto-approve tfplan

destroy:
  stage: destroy
  when: manual
  tags:
    - iac-runner-dev_shell
  script:
    - terraform init
    - terraform destroy -auto-approve
security_check:
  stage: validate
  tags:
    - iac-runner-dev_shell
  script:
    - terraform init
    - terraform validate
    - terraform plan -out=tfplan -input=false
    - terraform validate